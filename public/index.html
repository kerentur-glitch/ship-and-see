<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Launchpad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <div class="nav-row">
      <p class="eyebrow">Launchpad</p>
      <a class="nav-link" href="/pulse.html">Pulse ←</a>
    </div>
    <h1>לפרסם משהו קטן</h1>
    <p class="sub">כותרת, טקסט קצר, ותמונה — ובסוף מתקבלת כתובת חיה שאפשר לשתף.</p>

    <form id="publishForm" class="card" autocomplete="off">
      <label>
        <span>כותרת</span>
        <input type="text" id="title" placeholder="🚀 עכשיו חי: שם הפיצ'ר" autocomplete="off" required>
      </label>
      <label>
        <span>תיאור קצר</span>
        <textarea id="blurb" rows="3" placeholder="שתיים - שלוש שורות שמתארות הפיצ'ר" autocomplete="off"></textarea>
      </label>
      <label>
        <span>תמונה (לא חובה)</span>
        <input type="file" id="image" accept="image/*">
        <div id="imagePreviewBox" class="image-preview hidden">
          <img id="imagePreview" alt="">
          <span id="imagePreviewCaption"></span>
        </div>
      </label>
      <p id="formError" class="hint error-text hidden"></p>
      <button type="submit" id="submitBtn">פרסום</button>
    </form>

    <section id="progressCard" class="card hidden">
      <ol class="steps">
        <li id="step-building"><span class="dot"></span>בונים את הדף שלך</li>
        <li id="step-placing"><span class="dot"></span>ממקמים אותו באוויר</li>
        <li id="step-live"><span class="dot"></span>חי!</li>
      </ol>
    </section>

    <section id="successCard" class="card hidden">
      <p class="success-title">🎉 זה חי עכשיו</p>
      <a id="liveLink" class="live-link" href="#" target="_blank"></a>
      <div class="actions">
        <a id="openBtn" class="btn primary" href="#" target="_blank">פתיחת הדף</a>
        <a class="btn" href="/pulse.html">צפייה ב-Pulse</a>
        <button id="publishAnotherBtn" class="btn">פרסום נוסף</button>
      </div>
    </section>

    <section id="errorCard" class="card error hidden">
      <p class="error-title">משהו השתבש בזמן שהעלינו את הדף שלך לאוויר</p>
      <p class="error-body">שום דבר לא אבד — כל מה שכתבת עדיין שמור.</p>
      <div class="actions">
        <button id="retryBtn" class="btn primary">ניסיון נוסף</button>
        <button id="editBtn" class="btn">עריכת הפרטים</button>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
